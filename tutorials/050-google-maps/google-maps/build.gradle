applyAndroidApplication("com.nu.art.cyborg.tutorial_050.googleMaps", "google-maps")

android {
    defaultConfig {
        // Set maps.apiKey in local.properties (gitignored). Never commit a real key.
        def mapsApiKey = ""
        def localProps = new Properties()
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { localProps.load(it) }
            mapsApiKey = localProps.getProperty("maps.apiKey", "")
        }
        if (!mapsApiKey) {
            mapsApiKey = System.getenv("MAPS_API_KEY") ?: ""
        }
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
    }
}

dependencies {
    implementation(resolveDependency('cyborg-x', 'com.nu-art-software.cyborg', "${NU_ART_VERSION}"))
    implementation(resolveDependency('cyborg-maps', 'com.nu-art-software.cyborg', "${NU_ART_VERSION}"))
}
